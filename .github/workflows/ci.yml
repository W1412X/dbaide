name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for PyQt6
        run: |
          chmod +x packaging/linux/install_xcb_apt_deps.sh
          packaging/linux/install_xcb_apt_deps.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -q --tb=short -rf 2>&1 | tee pytest.log

      # Runner logs need an authenticated session, so a failure reported only in the log
      # text cannot be read from outside the job. Mirror the failing test ids into check
      # annotations, which the public API exposes.
      - name: Annotate failed tests
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log | head -40 | while IFS= read -r line; do
            printf '::error::%s\n' "${line:0:300}"
          done
          tail -3 pytest.log | while IFS= read -r line; do
            printf '::error::%s\n' "${line:0:300}"
          done
